version: '3.8'

services:
  jarvis-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-discord-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-ws://mcp-server:3000}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - mcp-server
    networks:
      - jarvis-network

  # Example MCP server (you can replace this with your actual MCP server)
  mcp-server:
    image: node:18-alpine
    container_name: jarvis-mcp-server
    working_dir: /app
    volumes:
      - ./mcp-server:/app
    command: npm start
    ports:
      - "3000:3000"
    networks:
      - jarvis-network
    restart: unless-stopped

networks:
  jarvis-network:
    driver: bridge
